
name: Build MarketDesk India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Android project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "MarketDesk India" "com.marketdesk.india" --web-dir www
          npx cap add android

      - name: Align Kotlin dependency versions
        run: |
          cat >> app/android/build.gradle <<'EOF'
          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MARKETDESK_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/marketdesk-release.jks
          test -s app/android/app/marketdesk-release.jks

      - name: Configure release signing and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MARKETDESK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARKETDESK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARKETDESK_KEY_PASSWORD }}
        run: |
          cat >> app/android/app/build.gradle <<'EOF'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
              }

              signingConfigs {
                  release {
                      storeFile file("marketdesk-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketdesk-v${{ github.run_number }}-${{ github.run_attempt }}
          name: MarketDesk India v${{ github.run_number }}
          body: |
            MarketDesk India personal research app.
            Signed release APK.
            Educational paper mode only; not for real trading.
          files: app/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
