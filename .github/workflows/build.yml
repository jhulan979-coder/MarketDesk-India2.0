
name: Build MarketDesk India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Android project
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "MarketDesk India" "com.marketdesk.india" --web-dir www
          npx cap add android
          
      - name: Align Kotlin dependency versions
        run: |
          cat >> app/android/build.gradle <<'EOF'
          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF
          

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketdesk-v${{ github.run_number }}
          name: MarketDesk India v${{ github.run_number }}
          body: |
            MarketDesk India personal research app.
            Download the APK below and install it on your Android phone.
            Demo data only; live market data is not connected yet.
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          
