name: Build MarketDesk India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web app and stock directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/www/data
          cp index.html app/www/index.html
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json' \
            --output app/www/data/instruments.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app/www/data/instruments.json','utf8')); if(!Array.isArray(p)||p.length<1000) process.exit(1); console.log('Instrument master rows:',p.length);"

      - name: Install Capacitor
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Initialize Android project
        working-directory: app
        run: |
          npx cap init "MarketDesk India" "com.marketdesk.india" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for release
        run: |
          mkdir -p release-files
          cp app/android/app/build/outputs/apk/debug/app-debug.apk release-files/MarketDesk-India.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketdesk-latest
          name: MarketDesk India - Latest APK
          body: |
            Educational research and virtual paper-trading app.
            Stock directory data is packaged during this build.
            No real-money trading is provided.
          files: release-files/MarketDesk-India.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
