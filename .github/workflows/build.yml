
name: Build MarketDesk India APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web app and stock directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/www/data
          cp index.html app/www/index.html

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json' \
            --output app/www/data/instruments.json

          node - <<'NODE'
          const fs = require('fs');
          const file = 'app/www/data/instruments.json';
          const rows = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!Array.isArray(rows) || rows.length < 1000) {
            throw new Error('Instrument master is empty or invalid');
          }

          const cash = rows.filter(item => {
            const exchange = String(item.exch_seg || '').toLowerCase();
            return ['nse_cm', 'bse_cm', 'nse', 'bse'].includes(exchange)
              && !String(item.instrumenttype || '').trim()
              && !String(item.expiry || '').trim()
              && String(item.symbol || '').trim();
          });

          if (cash.length < 1000) {
            throw new Error('Cash-equity directory validation failed');
          }

          console.log('Instrument rows:', rows.length);
          console.log('Cash-equity rows:', cash.length);
          NODE

      - name: Install Capacitor
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Initialize Android project
        working-directory: app
        run: |
          npx cap init "MarketDesk India" "com.marketdesk.india" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          unzip -t "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -F "package: name='com.marketdesk.india'"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Prepare APK for release
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
            release-files/MarketDesk-India.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketdesk-latest
          name: MarketDesk India - Latest APK
          body: |
            Educational research and virtual paper-trading app.
            Stock directory data is packaged during this build.
            No real-money trading is provided.
          files: release-files/MarketDesk-India.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
