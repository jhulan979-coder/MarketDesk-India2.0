<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketDesk India - Live Login & Signals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-signal { background-color: #28a745; margin-top: 10px; }
        .btn-signal:hover { background-color: #218838; }
        #result, #signalResult {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .signal-box {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Angel One Login Section -->
    <div class="container">
        <h2>Angel One Live Connect</h2>
        <div class="form-group">
            <label>API Key</label>
            <input type="text" id="apiKey" placeholder="Enter API Key">
        </div>
        <div class="form-group">
            <label>Client Code</label>
            <input type="text" id="clientCode" placeholder="Enter Client Code">
        </div>
        <div class="form-group">
            <label>Password (PIN)</label>
            <input type="password" id="password" placeholder="Enter Password">
        </div>
        <div class="form-group">
            <label>TOTP Secret</label>
            <input type="text" id="totpSecret" placeholder="Enter TOTP Secret Key">
        </div>
        <button class="btn" onclick="loginToAngelOne()">Connect Backend</button>
        <p id="result"></p>
    </div>

    <!-- Daily Signal Generator (Max 2 Signals, 1:2 RR) -->
    <div class="container">
        <h2>Stock / Index Signal Generator</h2>
        <p style="font-size: 13px; color: #666; text-align: center;">Rule: Din mein sirf 2 signals (1:2 Risk-Reward Ratio)</p>
        <button class="btn btn-signal" onclick="generateSignal()">Generate Today's Signal</button>
        <div id="signalResult"></div>
    </div>

    <script>
        async function loginToAngelOne() {
            const apiKey = document.getElementById('apiKey').value;
            const clientCode = document.getElementById('clientCode').value;
            const password = document.getElementById('password').value;
            const totpSecret = document.getElementById('totpSecret').value;
            const resultElement = document.getElementById('result');

            if (!apiKey || !clientCode || !password || !totpSecret) {
                resultElement.style.color = 'red';
                resultElement.innerText = "Please sabhi fields fill karein!";
                return;
            }

            resultElement.style.color = 'blue';
            resultElement.innerText = "Connecting to Hugging Face Backend...";

            try {
                const response = await fetch('https://jhulan27-marketdesk-backend.hf.space/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, clientCode, password, totpSecret })
                });

                const data = await response.json();

                if (data.status) {
                    resultElement.style.color = 'green';
                    resultElement.innerText = "Connected Successfully!";
                    localStorage.setItem('jwtToken', data.jwtToken);
                    localStorage.setItem('feedToken', data.feedToken);
                } else {
                    resultElement.style.color = 'red';
                    resultElement.innerText = "Error: " + data.message;
                }
            } catch (error) {
                console.error("Error:", error);
                resultElement.style.color = 'red';
                resultElement.innerText = "Backend server se connect nahi ho paya!";
            }
        }

        function generateSignal() {
            const signalBox = document.getElementById('signalResult');
            const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
            
            let storedDate = localStorage.getItem('signal_date');
            let signalCount = parseInt(localStorage.getItem('signal_count') || '0');

            // Agar din badal gaya hai toh count reset kar do
            if (storedDate !== today) {
                localStorage.setItem('signal_date', today);
                localStorage.setItem('signal_count', '0');
                signalCount = 0;
            }

            if (signalCount >= 2) {
                signalBox.innerHTML = "<p style='color: red;'>Aaj ka limit poora ho gaya hai! (Max 2 signals per day allowed).</p>";
                return;
            }

            // Next signal count increment karo
            signalCount++;
            localStorage.setItem('signal_count', signalCount);

            // Dummy 1:2 Ratio Calculation Example (Jaise Entry 100, SL 95 (Risk 5), Target 110 (Reward 10))
            let entry = 22450; // Nifty / Stock Example
            let stopLoss = 22420; // Risk = 30 points
            let target = 22510;   // Reward = 60 points (1:2 Ratio)

            signalBox.innerHTML = `
                <div class="signal-box">
                    <strong>Signal #${signalCount} (Ascribed 1:2 Ratio)</strong><br>
                    Instrument: NIFTY / Stock<br>
                    Action: BUY<br>
                    Entry Price: ${entry}<br>
                    Stop Loss (Risk): ${stopLoss} (-30 pts)<br>
                    Target (Reward): ${target} (+60 pts)<br>
                    <span style="color: green; font-weight: bold;">Aaj ke bache hue signals: ${2 - signalCount}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
